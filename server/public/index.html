<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>解题模型直测台 · MathEngine AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
  }
  header {
    border-bottom: 1px solid #1e293b; background: #020617cc; backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  header .inner {
    max-width: 1080px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  header h1 span { background: linear-gradient(90deg,#818cf8,#22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header .badge { font-size: 11px; color: #34d399; border: 1px solid #34d39955; background: #34d39914; padding: 4px 10px; border-radius: 999px; }
  header .nav { display: flex; gap: 8px; }
  header .nav a { font-size: 12px; color: #94a3b8; text-decoration: none; border: 1px solid #334155; padding: 5px 12px; border-radius: 999px; }
  header .nav a.active { color: #fff; background: #4f46e5; border-color: #4f46e5; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .card { background: #1e293b80; border: 1px solid #33415599; border-radius: 16px; padding: 20px; }
  .card h3 { font-size: 13px; color: #94a3b8; margin-bottom: 12px; font-weight: 600; letter-spacing: .3px; }

  label { display: block; font-size: 12px; color: #94a3b8; margin: 14px 0 6px; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical;
    background: #0f172a; border: 1px solid #334155; border-radius: 10px;
    color: #e2e8f0; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    padding: 12px; outline: none;
  }
  textarea:focus { border-color: #6366f1; }
  .drop {
    border: 2px dashed #334155; border-radius: 10px; padding: 18px; text-align: center;
    cursor: pointer; font-size: 12px; color: #64748b; transition: all .2s;
  }
  .drop:hover { border-color: #6366f1; color: #a5b4fc; }
  .drop img { max-width: 100%; max-height: 140px; margin-top: 8px; border-radius: 8px; }
  .btn {
    width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(90deg,#4f46e5,#0891b2); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity .2s;
  }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .hint { font-size: 11px; color: #475569; margin-top: 8px; line-height: 1.6; }

  .result { display: none; }
  .result.show { display: block; }
  .qtext { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; line-height: 1.7; color: #cbd5e1; }
  .kps { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .kp { font-size: 11px; color: #c7d2fe; background: #4f46e51f; border: 1px solid #4f46e555; padding: 4px 10px; border-radius: 999px; }
  .step { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; margin-top: 12px; }
  .step-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .step-no { font-size: 11px; font-weight: 700; color: #818cf8; background: #4f46e51a; border: 1px solid #4f46e544; padding: 3px 10px; border-radius: 999px; }
  .step-reason { font-size: 11px; color: #64748b; font-style: italic; }
  .step-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .step-content { font-size: 12px; color: #cbd5e1; font-family: ui-monospace, Menlo, monospace; background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; white-space: pre-wrap; line-height: 1.8; }
  .error { color: #f87171; background: #f8717114; border: 1px solid #f8717144; padding: 12px; border-radius: 10px; font-size: 12px; white-space: pre-wrap; margin-top: 12px; }
  .loading { text-align: center; padding: 30px 0; color: #94a3b8; font-size: 13px; display: none; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #334155; border-top-color: #818cf8; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -4px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>🧮 <span>解题模型直测台</span> · MathEngine AI</h1>
    <div class="nav">
      <a href="/" class="active">解题直测</a>
      <a href="/grader">判题直测</a>
    </div>
  </div>
</header>

<main>
  <!-- 左侧: 输入 -->
  <div class="card">
    <h3>输入题目（文本 或 照片）</h3>
    <label>题目文本 / LaTeX</label>
    <textarea id="question" placeholder="例如：求函数 f(x) = x^3 - 3x 的极值与单调区间&#10;或：已知 f(x)=x²+2x，求它在区间 [0,2] 上的定积分。"></textarea>

    <label>题目照片（可选，自动 OCR 提取题目）</label>
    <div class="drop" id="drop">
      点击上传 或 拖拽题目照片<br/>
      <span style="font-size:11px;color:#475569">支持 PNG/JPG（拍照的数学题直接可用）</span>
      <img id="preview" style="display:none" alt="预览"/>
      <input type="file" id="file" accept="image/*" hidden />
    </div>

    <button class="btn" id="solveBtn">开始解答（调用真实解题模型）</button>
    <div class="hint">接口：POST /api/v1/question/solve<br/>模型：qwen-plus（视觉提取：qwen-vl-max）</div>
    <div class="error" id="error" style="display:none"></div>
  </div>

  <!-- 右侧: 结果 -->
  <div class="card">
    <h3>解题结果</h3>
    <div class="loading" id="loading"><span class="spinner"></span>模型推理中，请稍候（约 10~30 秒）…</div>
    <div class="result" id="result">
      <label style="margin-top:0">题目原文</label>
      <div class="qtext" id="qtext"></div>
      <div class="kps" id="kps"></div>
      <div id="steps"></div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let imageDataUrl = null;

// ---- 图片选择 ----
$('drop').addEventListener('click', () => $('file').click());
$('drop').addEventListener('dragover', (e) => e.preventDefault());
$('drop').addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
$('file').addEventListener('change', (e) => e.target.files[0] && loadFile(e.target.files[0]));

function loadFile(file) {
  if (!/^image\//.test(file.type)) return alert('请上传图片文件');
  const reader = new FileReader();
  reader.onload = () => {
    imageDataUrl = reader.result;
    $('preview').src = imageDataUrl;
    $('preview').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

// ---- 解题 ----
$('solveBtn').addEventListener('click', solve);

async function solve() {
  const questionText = $('question').value.trim();
  if (!questionText && !imageDataUrl) return alert('请输入题目文本或上传题目照片');

  $('error').style.display = 'none';
  $('result').classList.remove('show');
  $('loading').style.display = 'block';
  $('solveBtn').disabled = true;

  try {
    const body = { questionText };
    if (imageDataUrl) body.image = imageDataUrl;
    const res = await fetch('/api/v1/question/solve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '解题失败');

    $('qtext').textContent = data.questionText || '';
    $('kps').innerHTML = (data.knowledgePoints || [])
      .map((kp) => `<span class="kp">${escapeHtml(kp)}</span>`).join('');
    $('steps').innerHTML = (data.steps || []).map((s) => `
      <div class="step">
        <div class="step-head">
          <span class="step-no">Step ${s.stepIndex}</span>
          <span class="step-reason">依据: ${escapeHtml(s.reason)}</span>
        </div>
        <div class="step-title">${escapeHtml(s.title)}</div>
        <div class="step-content">${escapeHtml(s.content)}</div>
      </div>`).join('');
    $('result').classList.add('show');
  } catch (err) {
    $('error').textContent = '❌ ' + (err.message || String(err));
    $('error').style.display = 'block';
  } finally {
    $('loading').style.display = 'none';
    $('solveBtn').disabled = false;
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
