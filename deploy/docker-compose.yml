# 一键部署编排 (示例)
# 用法: cp server/.env.production.example server/.env.production && 填写密钥
#       docker compose -f deploy/docker-compose.yml up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: math-ai-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"   # 仅本机可达, 由 Nginx 反代对外
    env_file:
      - ../server/.env.production
    environment:
      NODE_ENV: production
    mem_limit: 1g

  web:
    image: nginx:alpine
    container_name: math-ai-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
      # 证书目录 (自行放置 cert.pem / key.pem)
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
